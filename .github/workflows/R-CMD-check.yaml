# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}

run-name: "R-CMD-check ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: OS=${{ matrix.config.os }} R=${{ matrix.config.r }} py=${{ matrix.config.python }}

    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest , r: 'release', python: '' }

          - { os: ubuntu-latest, r: 'oldrel-1', python: '3.10' }
          - { os: ubuntu-latest, r: 'oldrel-2', python: '3.10' }
          - { os: ubuntu-latest, r: 'oldrel-3', python: '3.10' }
          - { os: ubuntu-latest, r: 'oldrel-4', python: '3.10' }
          # https://api.r-hub.io/rversions/resolve/oldrel/4

          - { os: ubuntu-latest, r: 'release', python: '3.9' }
          - { os: ubuntu-latest, r: 'release', python: '3.11' }
          - { os: ubuntu-latest, r: 'release', python: '3.12' }
          - { os: ubuntu-latest, r: 'release', python: '3.13' }

          - { os: ubuntu-latest, r: 'devel', python: '3.13', http-user-agent: 'release' }

          # test with one debug build of python
          # disabled; failing presently
          # - { os: ubuntu-latest , r: 'release', python: 'debug' }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Checkout code
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - uses: actions/setup-python@v4
        if: matrix.config.python != '' && matrix.config.python != 'debug'
        with:
          python-version: ${{ matrix.config.python }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
          # http-user-agent: ${{ matrix.config.http-user-agent }}

      - if: matrix.config.python == 'debug'
        name: setup python3-dbg
        run: |
          # sudo apt-get update
          sudo apt-get install -y python3-dbg python3-pip python3-venv
          # sudo rm -f /usr/bin/python3 /usr/bin/python
          sudo ln -sf /usr/bin/python3-dbg /usr/bin/python3
          sudo ln -sf /usr/bin/python3-dbg /usr/bin/python
          echo 'RETICULATE_PYTHON=/usr/bin/python' >> ~/.Renviron

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck local::.
          cache-version: 5
          upgrade: 'TRUE'

      - name: Test managed uv bootstrap from pwsh
        if: runner.os == 'Windows' && matrix.config.python == ''
        shell: pwsh
        env:
          RETICULATE_PYTHON: managed
          RETICULATE_UV: managed
          R_USER_CACHE_DIR: ${{ runner.temp }}\cold-reticulate-cache
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Recurse -Force $env:R_USER_CACHE_DIR -ErrorAction SilentlyContinue
          Rscript --vanilla -e "{ reticulate::import('json'); uv <- reticulate:::uv_binary(FALSE); stopifnot(!is.null(uv), file.exists(uv)) }"

      - name: setup r-reticulate venv
        if: matrix.config.python != '' && matrix.config.python != 'debug'
        shell: Rscript {0}
        run: |
          library(reticulate)
          path_to_venv <- virtualenv_create(
            envname = "r-reticulate",
            python = Sys.which("python"), # placed on PATH by the setup-python action
            packages = c(
              "docutils", "pandas", "pyarrow", "scipy", "matplotlib", "ipython",
              "tabulate", "plotly", "psutil", "kaleido", "wrapt"
            )
          )
          writeLines(
            paste0("RETICULATE_PYTHON=", virtualenv_python(path_to_venv)),
            Sys.getenv("GITHUB_ENV"))

